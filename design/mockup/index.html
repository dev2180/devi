<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devi app mockups</title>
<meta name="description" content="Mockups of the Devi app in crimson and gold: home, shortcuts, her screen and the icon.">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=boska@500,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap">
<link rel="stylesheet" href="./page.css">
</head>
<body>
<main class="board">
  <header class="board-head">
    <img class="mark" src="./icon-ivory.png" alt="">
    <div>
      <h1>Devi</h1>
      <p class="sub">Three screens, in the colours of her silk</p>
    </div>
  </header>

  <section class="screens" aria-label="App screens">
    <!-- 1. Home -->
    <figure class="screen-wrap">
      <div class="screen">
        <div class="top">
          <span class="word">Devi</span>
          <button class="ghost-icon" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
        </div>
        <div class="frame">
          <img src="./devi.jpg" alt="Linga Bhairavi, the main picture">
          <div class="now">
            <div class="now-text">
              <span class="now-title">Ae Devi Bhairavi</span>
              <span class="now-sub">Rising softly</span>
            </div>
            <button class="pill-ember" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg></button>
            <div class="rise" aria-hidden="true"><span></span></div>
          </div>
        </div>
        <h2>Her pictures</h2>
        <div class="thumbs">
          <div class="thumb main"><img src="./devi.jpg" alt=""><span class="tag">Main</span></div>
          <div class="thumb"><img src="./devi.jpg" alt="" class="alt"></div>
          <button class="thumb add" aria-label="Add pictures"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
        <h2>Chants</h2>
        <ul class="chants">
          <li><span>Ae Devi Bhairavi</span><span class="meta">1:02</span></li>
          <li><span>Devi Smaranam</span><span class="meta">7:36</span></li>
          <li><span>Linga Bhairavi Stuti</span><span class="meta">Paired with main</span></li>
        </ul>
      </div>
      <figcaption>Home: she leads, her chant rises beneath her</figcaption>
    </figure>

    <!-- 2. Shortcuts -->
    <figure class="screen-wrap">
      <div class="screen">
        <div class="top"><span class="word">How she appears</span></div>
        <div class="well on">
          <svg class="demo demo-vol" viewBox="0 0 160 210" aria-hidden="true">
<defs><clipPath id="clip-vol"><rect x="48.5" y="21.5" width="63" height="139" rx="11.5"/></clipPath></defs>
<g class="device">
<rect class="b-up" x="40" y="52" width="5" height="22" rx="2.5"/><rect class="b-dn" x="40" y="78" width="5" height="22" rx="2.5"/><rect class="b-pw" x="115" y="62" width="5" height="28" rx="2.5"/>
<rect class="rim" x="43" y="16" width="74" height="150" rx="16"/><rect class="body" x="45.5" y="18.5" width="69" height="145" rx="14"/>
<rect class="glass" x="48.5" y="21.5" width="63" height="139" rx="11.5"/>
<g clip-path="url(#clip-vol)"><rect class="wake" x="48.5" y="21.5" width="63" height="139"/><image class="her" href="./devi.jpg" x="48.5" y="40" width="63" height="112" preserveAspectRatio="xMidYMid meet"/><path class="sheen" d="M48 21 L70 21 L48 70 Z"/></g>
<circle class="cam" cx="80" cy="28" r="2.2"/>
</g>
<circle class="ripple r1" cx="40" cy="63" r="9"/><circle class="ripple r2" cx="40" cy="89" r="9"/><circle class="ripple r3" cx="40" cy="63" r="9"/>
<g class="thumb t-volL"><ellipse class="tshadow" cx="0" cy="34" rx="15" ry="5"/><path class="tskin" d="M-18 70 C-20 40 -14 8 0 2 C12 -2 18 10 16 30 C14 48 8 64 4 76 Z"/><path class="tshade" d="M4 76 C8 64 14 48 16 30 C17 22 15 14 12 9 C14 22 10 46 -2 72 Z"/><path class="tnail" d="M2 6 C9 4 13 10 12 18 C8 20 3 19 0 16 C-1 11 0 8 2 6 Z"/></g>
<g class="chips"><g class="chip c1"><rect x="22" y="182" width="34" height="18" rx="9"/><text x="39" y="195">Up</text></g><g class="chip c2"><rect x="62" y="182" width="36" height="18" rx="9"/><text x="80" y="195">Down</text></g><g class="chip c3"><rect x="104" y="182" width="34" height="18" rx="9"/><text x="121" y="195">Up</text></g></g>
</svg>
          <div class="well-text">
            <h3>Volume buttons</h3>
            <p class="note">Works on the lock screen</p>
          </div>
          <span class="switch on" role="switch" aria-checked="true" aria-label="Volume buttons" tabindex="0"><span></span></span>
        </div>
        <div class="well">
          <svg class="demo demo-pwr" viewBox="0 0 160 210" aria-hidden="true">
<defs><clipPath id="clip-pwr"><rect x="48.5" y="21.5" width="63" height="139" rx="11.5"/></clipPath></defs>
<g class="device">
<rect class="b-up" x="40" y="52" width="5" height="22" rx="2.5"/><rect class="b-dn" x="40" y="78" width="5" height="22" rx="2.5"/><rect class="b-pw" x="115" y="62" width="5" height="28" rx="2.5"/>
<rect class="rim" x="43" y="16" width="74" height="150" rx="16"/><rect class="body" x="45.5" y="18.5" width="69" height="145" rx="14"/>
<rect class="glass" x="48.5" y="21.5" width="63" height="139" rx="11.5"/>
<g clip-path="url(#clip-pwr)"><rect class="wake" x="48.5" y="21.5" width="63" height="139"/><image class="her" href="./devi.jpg" x="48.5" y="40" width="63" height="112" preserveAspectRatio="xMidYMid meet"/><path class="sheen" d="M48 21 L70 21 L48 70 Z"/></g>
<circle class="cam" cx="80" cy="28" r="2.2"/>
</g>
<circle class="ripple r1" cx="40" cy="63" r="9"/><circle class="ripple r2" cx="40" cy="89" r="9"/><circle class="ripple r3" cx="40" cy="63" r="9"/><circle class="ripple rp" cx="120" cy="76" r="9"/>
<g class="thumb t-pwrR"><ellipse class="tshadow" cx="0" cy="34" rx="15" ry="5"/><path class="tskin" d="M18 70 C20 40 14 8 0 2 C-12 -2 -18 10 -16 30 C-14 48 -8 64 -4 76 Z"/><path class="tshade" d="M-4 76 C-8 64 -14 48 -16 30 C-17 22 -15 14 -12 9 C-14 22 -10 46 2 72 Z"/><path class="tnail" d="M-2 6 C-9 4 -13 10 -12 18 C-8 20 -3 19 0 16 C1 11 0 8 -2 6 Z"/></g><g class="thumb t-pwrL"><ellipse class="tshadow" cx="0" cy="34" rx="15" ry="5"/><path class="tskin" d="M-18 70 C-20 40 -14 8 0 2 C12 -2 18 10 16 30 C14 48 8 64 4 76 Z"/><path class="tshade" d="M4 76 C8 64 14 48 16 30 C17 22 15 14 12 9 C14 22 10 46 -2 72 Z"/><path class="tnail" d="M2 6 C9 4 13 10 12 18 C8 20 3 19 0 16 C-1 11 0 8 2 6 Z"/></g>
<g class="chips"><g class="chip c1"><rect x="34" y="182" width="40" height="18" rx="9"/><text x="54" y="195">Power</text></g><g class="chip c2"><rect x="84" y="182" width="40" height="18" rx="9"/><text x="104" y="195">Volume</text></g></g>
</svg>
          <div class="well-text">
            <h3>Power, then volume</h3>
            <p class="note">One press each, never three</p>
          </div>
          <span class="switch" role="switch" aria-checked="false" aria-label="Power, then volume" tabindex="0"><span></span></span>
        </div>
        <div class="well slim">
          <div class="well-text">
            <h3>Greet me after a restart</h3>
            <p class="note">Once, the first time you open your phone</p>
          </div>
          <span class="switch" role="switch" aria-checked="false" aria-label="Greet me after a restart" tabindex="0"><span></span></span>
        </div>
      </div>
      <figcaption>Shortcuts: a thumb shows each one at real speed</figcaption>
    </figure>

    <!-- 3. Viewer -->
    <figure class="screen-wrap">
      <div class="screen viewer">
        <img src="./devi.jpg" alt="Devi shown whole on black, over the lock screen">
      </div>
      <figcaption>Her screen: whole, on black, nothing else</figcaption>
    </figure>
  </section>

  <section class="icons" aria-label="App icon">
    <div class="icon-row">
      <figure><img src="./icon-ivory.png" alt="Ivory icon"><figcaption>Day</figcaption></figure>
      <figure><img src="./icon-night.png" alt="Night icon"><figcaption>Night</figcaption></figure>
      <figure><img src="./icon-crimson.png" alt="Crimson icon"><figcaption>Crimson, by choice</figcaption></figure>
    </div>
    <p class="sub">Her eyes, as Isha drew them. The icon follows your phone’s light and dark theme.</p>
  </section>
</main>
</body>
</html>
